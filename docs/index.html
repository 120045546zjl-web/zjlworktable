</style><body><div id="app"></div><script>
const L={today:'\u4eca\u65e5',inbox:'\u6536\u96c6\u7bb1',projects:'\u9879\u76ee',calendar:'\u65e5\u5386',review:'\u590d\u76d8',settings:'\u8bbe\u7f6e',add:'\u6dfb\u52a0',task:'\u4efb\u52a1',save:'\u4fdd\u5b58',edit:'\u7f16\u8f91',del:'\u5220\u9664',archive:'\u5f52\u6863',name:'\u540d\u79f0',date:'\u65e5\u671f',time:'\u5f00\u59cb\u65f6\u95f4',priority:'\u4f18\u5148\u7ea7',duration:'\u9884\u8ba1\u65f6\u957f',group:'\u5206\u7ec4',note:'\u5907\u6ce8',uncat:'\u672a\u5206\u7c7b',morning:'\u4e0a\u5348',afternoon:'\u4e0b\u5348',unscheduled:'\u5f85\u5b89\u6392',quick:'\u5feb\u901f\u6dfb\u52a0'};const TODAY='2026-07-30',KEY='github-action-workspace-v4';let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S={settings:{name:'My Workspace',available:8,defaultDuration:30},projects:[{id:'p1',name:'Workspace',color:'#2563eb'},{id:'p2',name:'Content Plan',color:'#f59e0b'}],tasks:[{id:'t1',title:'Plan this week priorities',priority:'high',duration:60,date:TODAY,start:'09:00',projectId:'p1',group:L.morning,note:'',done:false},{id:'t2',title:'Finish workspace update',priority:'high',duration:120,date:TODAY,start:'14:00',projectId:'p1',group:L.afternoon,note:'',done:false},{id:'t3',title:'Team progress update',priority:'medium',duration:30,date:TODAY,start:'16:00',projectId:'p2',group:L.afternoon,note:'',done:false},{id:'t4',title:'Organize reading notes',priority:'low',duration:45,date:TODAY,start:'',projectId:'',group:L.unscheduled,note:'',done:false}],review:'',next:''};S.settings={name:'My Workspace',available:8,defaultDuration:30,...S.settings};let page=L.today,selectedDate=TODAY,view='month',detail='';function persist(){localStorage.setItem(KEY,JSON.stringify(S));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function P(id){return S.projects.find(x=>x.id===id)}function actives(){return S.projects.filter(x=>!x.archived)}function title(d){return d===TODAY?L.today+' - 7/30':d}function go(x){page=x;detail='';render()}function row(t){let p=P(t.projectId);return `<div class="row ${t.done?'done':''}"><button class="check" onclick="toggle('${t.id}')">${t.done?'OK':''}</button><button class="task" onclick="openTask('${t.id}')"><strong>${esc(t.title)}</strong><span><i class="dot ${t.priority}"></i>${t.priority} - ${t.duration} min${p?' - '+esc(p.name):''}</span></button><span class="actions"><button onclick="openTask('${t.id}')">${L.edit}</button><button onclick="delay('${t.id}')">+1</button><button class="danger" onclick="removeTask('${t.id}')">${L.del}</button></span></div>`}function list(a,msg){return a.length?a.map(row).join(''):`<p class="empty">${msg||L.today+' '+L.task+' 0'}</p>`}function timeline(d){let a=S.tasks.filter(t=>t.date===d&&t.start&&!t.done),min=a.reduce((n,t)=>n+Number(t.duration),0);return `<aside class="timeline"><div class="head"><div><small>${L.today}</small><h2>${L.calendar}</h2></div><b class="usage">${(min/60).toFixed(1)}h / ${S.settings.available}h</b></div>${['09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00'].map(x=>{let t=a.find(q=>q.start===x);return `<div class="slot"><button onclick="newTask('${d}','${x}')">${x}</button>${t?`<button class="event ${t.priority==='high'?'high':''}" onclick="openTask('${t.id}')"><b>${esc(t.title)}</b><small>${t.duration} min</small></button>`:''}</div>`}).join('')}</aside>`}function today(){let a=S.tasks.filter(t=>t.date===TODAY),top=a.filter(t=>!t.done).sort((x,y)=>({high:0,medium:1,low:2}[x.priority]-({high:0,medium:1,low:2}[y.priority])).slice(0,3);return `<div class="page"><div class="hello"><div><small>${L.today}</small><h2>Focus on what matters.</h2></div><span>${a.filter(t=>t.done).length}/${a.length}</span></div><section class="card important"><div class="head"><div><small>TOP 3</small><h2>3 ${L.priority} ${L.task}</h2></div><button onclick="newTask(TODAY,'09:00')">+ ${L.add}</button></div>${list(top,'No high priority tasks')}</section><section class="card"><div class="head"><div><small>TODAY</small><h2>${L.today} ${L.task}</h2></div><button onclick="newTask(TODAY,'09:00')">+ ${L.add}</button></div>${[L.morning,L.afternoon,L.unscheduled].map(g=>`<div class="group"><button onclick="fold('${g}')">${g}<small>${a.filter(t=>t.group===g).length}</small></button><div id="g${g}">${list(a.filter(t=>t.group===g),'')}<button class="addline" onclick="newTask(TODAY,'','${g}')">+ ${L.add} ${L.task}</button></div></div>`).join('')}</section><div class="mobiletime">${timeline(TODAY)}</div></div>`}function inbox(){let a=S.tasks.filter(t=>!t.projectId);return `<div class="page"><div class="toolbar"><h2 class="page-title">${L.inbox}</h2><button class="primary" onclick="newTask(selectedDate,'09:00')">+ ${L.add} ${L.task}</button></div><section class="card">${list(a,'Empty')}</section></div>`}function projects(){return `<div class="page"><div class="toolbar"><h2 class="page-title">${L.projects}</h2><button class="primary" onclick="projectModal()">+ ${L.add} ${L.projects}</button></div><div class="grid">${actives().map(p=>{let a=S.tasks.filter(t=>t.projectId===p.id);return `<article class="project"><button onclick="showProject('${p.id}')"><i class="color" style="background:${p.color}"></i><h3>${esc(p.name)}</h3><p>${a.length} ${L.task}</p></button><div class="project-actions"><button onclick="projectModal('${p.id}')">${L.edit}</button><button onclick="archive('${p.id}')">${L.archive}</button><button class="danger" onclick="deleteProject('${p.id}')">${L.del}</button></div></article>`}).join('')}</div></div>`}function details(){let p=P(detail),a=S.tasks.filter(t=>t.projectId===detail);return `<div class="page"><div class="toolbar"><h2 class="page-title">${esc(p.name)}</h2><button class="primary" onclick="newTask(selectedDate,'09:00','${L.unscheduled}','${p.id}')">+ ${L.add} ${L.task}</button></div><section class="card">${list(a,'Empty')}</section></div>`}function calendar(){let ds=['2026-07-27','2026-07-28','2026-07-29',TODAY,'2026-07-31','2026-08-01','2026-08-02'],a=S.tasks.filter(t=>t.date===selectedDate);return `<div class="page"><h2 class="page-title">${L.calendar}</h2><div class="toolbar"><div class="switch"><button class="${view==='day'?'on':''}" onclick="view='day';render()">DAY</button><button class="${view==='month'?'on':''}" onclick="view='month';render()">MONTH</button></div><span class="hint">${title(selectedDate)}</span></div>${view==='month'?`<div class="month">${ds.map(d=>`<button class="day ${d===selectedDate?'active':''}" onclick="pick('${d}')"><b>${d.slice(-2)}</b><small>${S.tasks.filter(t=>t.date===d).length} ${L.task}</small></button>`).join('')}</div>`:`<section class="card"><h3>${selectedDate}</h3>${list(a,'No tasks for this date')}<button class="addline" onclick="newTask(selectedDate,'09:00')">+ ${L.add} ${L.task}</button></section><div class="mobiletime" style="display:block">${timeline(selectedDate)}</div>`}</div>`}function review(){let n=S.tasks.filter(t=>t.done).length;return `<div class="page"><h2 class="page-title">${L.review}</h2><div class="stats"><div><b>${n}</b><small>Done</small></div><div><b>${S.tasks.length-n}</b><small>Open</small></div><div><b>${actives().length}</b><small>${L.projects}</small></div></div><section class="card"><label>Summary<textarea id="review">${esc(S.review)}</textarea></label><label>Next week<textarea id="next">${esc(S.next)}</textarea></label><button class="primary" onclick="saveReview()">${L.save}</button></section></div>`}function settings(){return `<div class="page"><h2 class="page-title">${L.settings}</h2><section class="card"><label>${L.name}<input id="name" value="${esc(S.settings.name)}"></label><label>Hours<input id="hours" type="number" value="${S.settings.available}"></label><label>Default ${L.duration}<input id="duration" type="number" value="${S.settings.defaultDuration}"></label><button class="primary" onclick="saveSettings()">${L.save}</button></section></div>`}function render(){let content=page===L.today?today():page===L.inbox?inbox():page===L.projects?projects():page==='detail'?details():page===L.calendar?calendar():page===L.review?review():settings();app.innerHTML=`<div class="app"><aside class="side"><button class="brand" onclick="go(L.today)"><i>OK</i>${esc(S.settings.name)}</button>${[L.today,L.inbox,L.projects,L.calendar,L.review,L.settings].map(x=>`<button class="nav ${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('')}<button class="logout" onclick="logout()">Exit</button></aside><section class="main"><header><small>${title(selectedDate)}</small>${page===L.today?`<button class="primary" onclick="newTask(selectedDate,'09:00')">+ <span>${L.quick}</span></button>`:''}</header>${content}</section>${page===L.today?timeline(TODAY):''}</div><nav class="tabs"><button onclick="go(L.today)">${L.today}</button><button onclick="go(L.inbox)">${L.inbox}</button><button onclick="go(L.projects)">${L.projects}</button><button onclick="go(L.calendar)">${L.calendar}</button><button onclick="go(L.review)">More</button></nav>`}function pick(d){selectedDate=d;view='day';render()}function fold(g){let e=document.getElementById('g'+g);e.style.display=e.style.display==='none'?'block':'none'}function toggle(id){let t=S.tasks.find(x=>x.id===id);t.done=!t.done;persist()}function delay(id){let t=S.tasks.find(x=>x.id===id);t.date='2026-07-31';t.start='';t.group=L.unscheduled;persist()}function removeTask(id){if(confirm('Delete task?')){S.tasks=S.tasks.filter(x=>x.id!==id);persist()}}let editing;function newTask(d=selectedDate,start='09:00',group='',pid=''){editing={id:'',title:'',priority:'medium',duration:S.settings.defaultDuration,date:d,start,projectId:pid,group:group||((start||'')<'12:00'?L.morning:L.afternoon),note:'',done:false};taskModal()}function openTask(id){editing={...S.tasks.find(x=>x.id===id)};taskModal()}function taskModal(){let t=editing;document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><form class="modal" onsubmit="saveTask(event)"><div class="modalhead"><h2>${t.id?L.edit: s="primary">${L.save}</button></form></div>`)}function saveProject(e,id){e.preventDefault();let f=e.target,p={id:id||'p'+Date.now(),name:f.name.value,color:f.color.value};S.projects=id?S.projects.map(x=>x.id===id?{...x,...p}:x):[...S.projects,p];e.target.closest('.overlay').remove();persist()}function archive(id){let p=P(id);p.archived=!p.archived;persist()}function deleteProject(id){if(confirm('Delete project and keep its tasks unclassified?')){S.tasks=S.tasks.map(t=>t.projectId===id?{...t,projectId:''}:t);S.projects=S.projects.filter(p=>p.id!==id);persist()}}function showProject(id){detail=id;page='detail';render()}function saveSettings(){S.settings.name=document.getElementById('name').value||'My Workspace';S.settings.available=+document.getElementById('hours').value||8;S.settings.defaultDuration=+document.getElementById('duration').value||30;persist()}function saveReview(){S.review=document.getElementById('review').value;S.next=document.getElementById('next').value;persist()}function logout(){if(confirm('Clear local data?')){localStorage.removeItem(KEY);location.reload()}}Object.assign(window,{L,go,newTask,openTask,toggle,delay,removeTask,pick,fold,projectModal,saveProject,archive,deleteProject,showProject,saveSettings,saveReview,logout});render();

function tasks2(a,empty){if(!a.length)return '<p class="empty">'+(empty||'No tasks')+'</p>';return a.map(function(t){var p=p2(t.projectId);return '<div class="row '+(t.done?'done':'')+'"><button class="check" onclick="WToggle(\''+t.id+'\')">'+(t.done?'OK':'')+'</button><button class="task" onclick="WEdit(\''+t.id+'\')"><strong>'+e2(t.title)+'</strong><span>'+t.priority+' - '+t.duration+' min'+(p?' - '+e2(p.name):'')+'</span></button><span class="actions"><button onclick="WEdit(\''+t.id+'\')">Edit</button><button class="danger" onclick="WDelete(\''+t.id+'\')">Delete</button></span></div>'}).join('')}
function timeline2(d){var a=W.tasks.filter(function(t){return t.date===d&&t.start&&!t.done}),n=a.reduce(function(s,t){return s+Number(t.duration)},0),times=['09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00'];return '<aside class="timeline"><div class="head"><h2>Schedule</h2><b class="usage">'+(n/60).toFixed(1)+'h / '+W.hours+'h</b></div>'+times.map(function(x){var t=a.find(function(q){return q.start===x});return '<div class="slot"><button onclick="WNew(\''+d+'\',\''+x+'\')">'+x+'</button>'+(t?'<button class="event '+(t.priority==='high'?'high':'')+'" onclick="WEdit(\''+t.id+'\')"><b>'+e2(t.title)+'</b><small>'+t.duration+' min</small></button>':'')+'</div>'}).join('')+'</aside>'}
function top2(){var a=W.tasks.filter(function(t){return t.date===T2}),top=a.filter(function(t){return !t.done}).sort(function(x,y){return ({high:0,medium:1,low:2}[x.priority]-{high:0,medium:1,low:2}[y.priority])}).slice(0,3);return '<div class="page"><div class="hello"><div><small>Today</small><h2>Focus on what matters.</h2></div><span>'+a.filter(function(t){return t.done}).length+'/'+a.length+'</span></div><section class="card important"><div class="head"><h2>Top 3 tasks</h2><button onclick="WNew(T2,\'09:00\')">+ Add</button></div>'+tasks2(top,'No high priority tasks')+'</section><section class="card"><div class="head"><h2>Today tasks</h2><button onclick="WNew(T2,\'09:00\')">+ Add task</button></div>'+['AM','PM','Unscheduled'].map(function(g){return '<div class="group"><button>'+g+'</button>'+tasks2(a.filter(function(t){return t.group===g}), '')+'<button class="addline" onclick="WNew(T2,\'\',\''+g+'\')">+ Add task</button></div>'}).join('')+'</section><div class="mobiletime">'+timeline2(T2)+'</div></div>'}
function cal2(){var ds=['2026-07-27','2026-07-28','2026-07-29',T2,'2026-07-31','2026-08-01','2026-08-02'];if(mode==='day'){var a=W.tasks.filter(function(t){return t.date===day});return '<div class="page"><h2 class="page-title">Calendar</h2><div class="toolbar"><button class="switch" onclick="mode=\'month\';draw2()">Month view</button><span>'+day+'</span></div><section class="card"><h3>'+day+'</h3>'+tasks2(a,'No tasks for this date')+'<button class="addline" onclick="WNew(day,\'09:00\')">+ Schedule new task</button></section><div class="mobiletime" style="display:block">'+timeline2(day)+'</div></div>'}return '<div class="page"><h2 class="page-title">Calendar</h2><div class="toolbar"><div class="switch"><button onclick="mode=\'day\';draw2()">Day</button><button class="on">Month</button></div><span>'+day+'</span></div><div class="month">'+ds.map(function(d){return '<button class="day '+(d===day?'active':'')+'" onclick="WPick(\''+d+'\')"><b>'+d.slice(-2)+'</b><small>'+W.tasks.filter(function(t){return t.date===d}).length+' tasks</small></button>'}).join('')+'</div></div>'}
function project2(){if(pg==='Detail'){var p=p2(pid);return '<div class="page"><div class="toolbar"><h2 class="page-title">'+e2(p.name)+'</h2><button class="primary" onclick="WNew(day,\'09:00\',\'Unscheduled\',\''+p.id+'\')">+ Add project task</button></div><section class="card">'+tasks2(W.tasks.filter(function(t){return t.projectId===p.id}),'No tasks')+'</section></div>'}return '<div class="page"><div class="toolbar"><h2 class="page-title">Projects</h2><button class="primary" onclick="WProject()">+ New project</button></div><div class="grid">'+active2().map(function(p){return '<article class="project"><button onclick="WDetail(\''+p.id+'\')"><i class="color" style="background:'+p.color+'"></i><h3>'+e2(p.name)+'</h3><p>'+W.tasks.filter(function(t){return t.projectId===p.id}).length+' tasks</p></button><div class="project-actions"><button onclick="WProject(\''+p.id+'\')">Edit</button><button onclick="WArchive(\''+p.id+'\')">Archive</button><button class="danger" onclick="WProjectDelete(\''+p.id+'\')">Delete</button></div></article>'}).join('')+'</div></div>'}
function page2(){if(pg==='Today')return top2();if(pg==='Inbox')return '<div class="page"><div class="toolbar"><h2 class="page-title">Inbox</h2><button class="primary" onclick="WNew(day,\'09:00\')">+ New task</button></div><section class="card">'+tasks2(W.tasks.filter(function(t){return !t.projectId}),'Inbox empty')+'</section></div>';if(pg==='Projects'||pg==='Detail')return project2();if(pg==='Calendar')return cal2();if(pg==='Review')return '<div class="page"><h2 class="page-title">Review</h2><section class="card"><label>Summary<textarea id="r2">'+e2(W.review)+'</textarea></label><label>Next week<textarea id="n2">'+e2(W.next)+'</textarea></label><button class="primary" onclick="WReview()">Save review</button></section></div>';return '<div class="page"><h2 class="page-title">Settings</h2><section class="card"><label>Workspace name<input id="wn" value="'+e2(W.name)+'"></label><label>Available hours<input id="wh" type="number" value="'+W.hours+'"></label><label>Default duration<input id="wd" type="number" value="'+W.def+'"></label><button class="primary" onclick="WSettings()">Save settings</button></section></div>'}
function draw2(){app.innerHTML='<div class="app"><aside class="side"><button class="brand" onclick="WGo(\'Today\')"><i>OK</i>'+e2(W.name)+'</button>'+['Today','Inbox','Projects','Calendar','Review','Settings'].map(function(x){return '<button class="nav '+(pg===x?'active':'')+'" onclick="WGo(\''+x+'\')">'+x+'</button>'}).join('')+'</aside><section class="main"><header><small>'+day+'</small>'+(pg==='Today'?'<button class="primary" onclick="WNew(day,\'09:00\')">+ Quick add</button>':'')+'</header>'+page2()+'</section>'+(pg==='Today'?timeline2(T2):'')+'</div><nav class="tabs"><button onclick="WGo(\'Today\')">Today</button><button onclick="WGo(\'Inbox\')">Inbox</button><button onclick="WGo(\'Projects\')">Projects</button><button onclick="WGo(\'Calendar\')">Calendar</button><button onclick="WGo(\'Review\')">More</button></nav>'}
function WGo(x){pg=x;pid='';draw2()}function WPick(d){day=d;mode='day';draw2()}function WToggle(id){var t=W.tasks.find(function(x){return x.id===id});t.done=!t.done;save2()}function WDelete(id){if(confirm('Delete task?')){W.tasks=W.tasks.filter(function(x){return x.id!==id});save2()}}var E;function WNew(d,st,g,projectId){E={id:'',title:'',projectId:projectId||'',priority:'medium',duration:W.def,date:d||day,start:st||'09:00',group:g||'AM',note:'',done:false};WTaskModal()}function WEdit(id){E=Object.assign({},W.tasks.find(function(x){return x.id===id}));WTaskModal()}function WTaskModal(){var opts='<option value="">Uncategorized</option>'+active2().map(function(p){return '<option value="'+p.id+'" '+(E.projectId===p.id?'selected':'')+'>'+e2(p.name)+'</option>'}).join('');document.body.insertAdjacentHTML('beforeend','<div class="overlay"><form class="modal" onsubmit="WTaskSave(event)"><div class="modalhead"><h2>Task</h2><button type="button" onclick="this.closest(\'.overlay\').remove()">X</button></div><label>Title<input name="title" value="'+e2(E.title)+'" required></label><div class="fields"><label>Project<select name="project">'+opts+'</select></label><label>Priority<select name="priority"><option>high</option><option selected>medium</option><option>low</option></select></label><label>Duration<input name="duration" type="number" value="'+E.duration+'"></label><label>Date<input name="date" type="date" value="'+E.date+'"></label><label>Start time<input name="start" type="time" value="'+E.start+'"></label><label>Group<select name="group"><option>AM</option><option>PM</option><option>Unscheduled</option></select></label></div><label>Note<textarea name="note">'+e2(E.note)+'</textarea></label><button class="primary">Save task</button></form></div>')}
function WTaskSave(e){e.preventDefault();var f=e.target,t={id:E.id||'t'+Date.now(),title:f.title.value,projectId:f.project.value,priority:f.priority.value,duration:+f.duration.value,date:f.date.value,start:f.start.value,group:f.group.value,note:f.note.value,done:E.done};W.tasks=E.id?W.tasks.map(function(x){return x.id===t.id?t:x}):W.tasks.concat(t);e.target.closest('.overlay').remove();save2()}function WProject(id){var p=id?p2(id):{id:'',name:'',color:'#2563eb'};document.body.insertAdjacentHTML('beforeend','<div class="overlay"><form class="modal" onsubmit="WProjectSave(event,\''+id+'\')"><label>Name<input name="name" value="'+e2(p.name)+'" required></label><label>Color<input name="color" type="color" value="'+p.color+'"></label><button class="primary">Save project</button></form></div>')}function WProjectSave(e,id){e.preventDefault();var f=e.target,p={id:id||'p'+Date.now(),name:f.name.value,color:f.color.value};W.projects=id?W.projects.map(function(x){return x.id===id?Object.assign({},x,p):x}):W.projects.concat(p);e.target.closest('.overlay').remove();save2()}function WArchive(id){p2(id).archived=!p2(id).archived;save2()}function WProjectDelete(id){if(confirm('Delete project and keep tasks uncategorized?')){W.tasks=W.tasks.map(function(t){return t.projectId===id?Object.assign({},t,{projectId:''}):t});W.projects=W.projects.filter(function(p){return p.id!==id});save2()}}function WDetail(id){pid=id;pg='Detail';draw2()}function WSettings(){W.name=document.getElementById('wn').value||'My Workspace';W.hours=+document.getElementById('wh').value||8;W.def=+document.getElementById('wd').value||30;save2()}function WReview(){W.review=document.getElementById('r2').value;W.next=document.getElementById('n2').value;save2()}Object.assign(window,{WGo:WGo,WPick:WPick,WToggle:WToggle,WDelete:WDelete,WNew:WNew,WEdit:WEdit,WTaskSave:WTaskSave,WProject:WProject,WProjectSave:WProjectSave,WArchive:WArchive,WProjectDelete:WProjectDelete,WDetail:WDetail,WSettings:WSettings,WReview:WReview});draw2();
})();
</script>
