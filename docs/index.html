<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行动工作台</title><style>
:root{--b:#2563eb;--i:#172033;--m:#64748b;--l:#e5eaf0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px Arial,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr 300px}.side{padding:24px 12px;background:#fff;border-right:1px solid var(--l);display:flex;flex-direction:column}.brand{font-weight:800;font-size:17px;text-align:left;padding:7px 10px 36px}.brand i{font-style:normal;background:var(--b);color:#fff;padding:6px 8px;border-radius:8px;margin-right:9px}.side small,.ey{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;font-weight:bold}.side small{padding:0 10px 10px}.nav{height:44px;text-align:left;border-radius:8px;padding:0 12px;color:var(--m);width:100%}.nav.active,.nav:hover{background:#eff6ff;color:var(--b)}.logout{margin-top:auto;text-align:left;color:var(--m);padding:12px}.main{max-width:940px;width:100%;margin:auto;padding:0 34px 50px}header{height:82px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}header small{color:var(--m)}h1{font-size:17px;margin:4px 0}.primary{background:var(--b);color:white;border-radius:7px;font-weight:bold;padding:10px 14px;min-height:40px}.page{padding-top:34px}.intro,.hello,.head{display:flex;justify-content:space-between;align-items:start}.intro h2,.hello h2{margin:8px 0;font-size:24px;letter-spacing:-.5px}.intro p,.hello small,.hello span{color:var(--m)}.hello{align-items:end;margin-bottom:22px}.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:20px;margin-bottom:16px}.important{border-left:3px solid var(--b)}.head h2{font-size:17px;margin:7px 0 0}.head button,.addline{color:var(--b);font-size:13px;font-weight:bold}.row{display:flex;gap:10px;align-items:center;min-height:62px;border-top:1px solid #eef1f5;position:relative}.row:first-of-type{border:0}.check{width:20px;height:20px;border:1px solid #cbd5e1;border-radius:50%;color:#fff}.done .check{background:#94a3b8}.done strong{text-decoration:line-through;color:#94a3b8}.title{flex:1;text-align:left;min-width:0}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.title span{display:block;font-size:11px;color:#94a3b8;margin-top:5px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3b82f6;margin-right:4px}.高{background:#ef4444}.中{background:#f59e0b}.dots{color:#94a3b8}.menu{position:absolute;right:0;top:45px;z-index:3;border:1px solid var(--l);box-shadow:0 6px 18px #0002;background:#fff;padding:4px;border-radius:7px}.menu button{display:block;width:115px;text-align:left;padding:8px;font-size:12px}.group{padding-top:12px}.group>button:first-child{display:flex;justify-content:space-between;width:100%;font-weight:bold;padding:5px 0 8px}.group small{font-weight:normal;color:#94a3b8}.timeline{background:#fff;border-left:1px solid var(--l);padding:25px 20px}.timeline h2{font-size:17px;margin:7px 0}.usage{font-size:11px;color:var(--m);background:#f1f5f9;padding:5px;border-radius:5px}.slot{display:grid;grid-template-columns:43px 1fr;min-height:55px;border-top:1px solid #f0f2f4}.slot>button{color:#94a3b8;font-size:10px;text-align:left}.event{margin:5px 0;padding:8px;background:#eff6ff;border-left:3px solid #3b82f6;border-radius:4px;text-align:left}.event.high{background:#fef2f2;border-color:#ef4444}.event strong,.event small{display:block;font-size:11px}.event small{color:var(--m);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.project{background:#fff;border:1px solid var(--l);padding:18px;border-radius:10px;text-align:left}.project i{display:block;width:10px;height:10px;border-radius:50%;background:var(--b);margin-bottom:20px}.project p{color:var(--m);font-size:12px}.bar{height:4px;background:#eef1f5;border-radius:4px}.bar span{display:block;height:100%;width:55%;background:var(--b)}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{height:78px;border:1px solid var(--l);background:#fff;border-radius:7px;padding:10px;text-align:left}.day.active{border-color:var(--b);background:#eff6ff}.day small{display:block;color:var(--m);margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stats div{padding:18px;background:#fff;border:1px solid var(--l);border-radius:9px}.stats b,.stats small{display:block}.stats b{font-size:26px}.stats small{color:var(--m)}label{display:block;font-weight:bold;font-size:13px;margin-bottom:15px}input,select,textarea{width:100%;margin-top:7px;padding:10px;border:1px solid #dbe1e8;border-radius:6px;background:#fff}textarea{height:94px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.overlay{position:fixed;inset:0;background:#0f172a66;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:11px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:19px}.tabs{display:none}@media(max-width:1050px){.app{grid-template-columns:200px 1fr}.timeline{display:none}.mobiletime{display:block}.mobiletime .timeline{display:block;border:1px solid var(--l);border-radius:10px;margin-top:16px}}@media(max-width:767px){.app{display:block;padding-bottom:68px}.side{display:none}.main{padding:0 16px 20px}.main header{height:63px}.page{padding-top:22px}.hello{display:block}.intro h2,.hello h2{font-size:21px}.card{padding:16px}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:67px;background:#fff;border-top:1px solid var(--l);z-index:8;justify-content:space-around}.tabs button{font-size:11px;color:var(--m)}.grid{grid-template-columns:1fr}.month{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:1fr}.overlay{align-items:end;padding:0}.modal{border-radius:14px 14px 0 0}.primary span{display:none}}
</style><body><div id="app"></div><script>
const T='2026-07-30',K='action-workspace-pages';let data=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[{id:1,title:'梳理本周最重要的目标',priority:'高',duration:60,date:T,start:'09:00',project:'个人工作台',done:false,group:'上午'},{id:2,title:'完成工作台改版方案',priority:'高',duration:120,date:T,start:'14:00',project:'个人工作台',done:false,group:'下午'},{id:3,title:'给团队同步项目进展',priority:'中',duration:30,date:T,start:'16:00',project:'内容计划',done:false,group:'下午'},{id:4,title:'整理阅读笔记',priority:'低',duration:45,date:T,project:'内容计划',done:false,group:'待安排'}],projects:['个人工作台','内容计划'],review:'',next:''},page='今日',date=T,editing=null;function save(){localStorage.setItem(K,JSON.stringify(data));render()}function rows(list){return list.map(t=>`<div class="row ${t.done?'done':''}"><button class="check" onclick="toggle(${t.id})">${t.done?'✓':''}</button><button class="title" onclick="openEdit(${t.id})"><strong>${esc(t.title)}</strong><span><i class="dot ${t.priority}"></i>${t.priority}优先级 · ${t.duration} 分钟 · ${esc(t.project||'未分类')}</span></button><button class="dots" onclick="menu(${t.id})">•••</button><div id="m${t.id}"></div></div>`).join('')}function esc(x){return String(x||'').replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}function nav(){return ['今日','收集箱','项目','日历','复盘','设置'].map(x=>`<button class="nav ${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('')}function time(){let a=data.tasks.filter(t=>t.date===T&&t.start&&!t.done),n=a.reduce((s,t)=>s+t.duration,0);return `<aside class="timeline"><div class="head"><div><small class="ey">今日安排</small><h2>日程</h2></div><b class="usage">${n/60}h / 8h</b></div>${['09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00'].map(x=>{let t=a.find(t=>t.start===x);return `<div class="slot"><button onclick="add('${x}')">${x}</button>${t?`<button class="event ${t.priority==='高'?'high':''}" onclick="openEdit(${t.id})"><strong>${esc(t.title)}</strong><small>${t.duration} 分钟</small></button>`:''}</div>`}).join('')}</aside>`}function today(){let a=data.tasks.filter(t=>t.date===T),top=a.filter(t=>!t.done).sort((a,b)=>'高中低'.indexOf(a.priority)-'高中低'.indexOf(b.priority)).slice(0,3);return `<div class="page"><div class="hello"><div><small>早上好</small><h2>把今天留给真正重要的事。</h2></div><span>${a.filter(t=>t.done).length}/${a.length} 已完成</span></div><section class="card important"><div class="head"><div><small class="ey">行动优先</small><h2>今天最重要的三件事</h2></div><button onclick="add()">＋ 添加</button></div>${rows(top)||'<p>今天还没有高优先级任务。</p>'}</section><section class="card"><div class="head"><div><small class="ey">今日清单</small><h2>今日任务</h2></div><button onclick="add()">＋ 添加待办</button></div>${['上午','下午','待安排'].map(g=>`<div class="group"><button onclick="fold('${g}')">⌄ ${g}<small>${a.filter(t=>t.group===g).length} 项</small></button><div id="g${g}">${rows(a.filter(t=>t.group===g))}<button class="addline" onclick="add('', '${g}')">＋ 添加任务</button></div></div>`).join('')}</section><div class="mobiletime">${time()}</div></div>`}function inbox(){let a=data.tasks.filter(t=>!t.project||!t.start);return wrap('收集箱','先收集，再决定它属于哪里。',`<section class="card">${rows(a)||'<p>收集箱已经清空。</p>'}</section>`)}function projects(){return wrap('项目','把相关行动聚合在一起。',`<div class="grid">${data.projects.map(p=>{let a=data.tasks.filter(t=>t.project===p),d=a.filter(t=>t.done).length;return `<button class="project" onclick="detail('${p}')"><i></i><h3>${p}</h3><p>${a.length} 项任务 · ${d} 项完成</p><div class="bar"><span style="width:${a.length?d/a.length*100:0}%"></span></div></button>`}).join('')}</div>`,true)}function calendar(){let ds=['27','28','29','30','31','01','02'];return wrap('日历','为任务安排具体日期和时间。',`<div class="month">${ds.map((d,i)=>`<button class="day ${i===3?'active':''}" onclick="alert('已切换到 ${d} 日任务列表')"><b>${d}</b><small>${i===3?data.tasks.filter(t=>t.date===T).length:0} 项</small></button>`).join('')}</div><section class="card"><h3>今天</h3>${rows(data.tasks.filter(t=>t.date===T))}</section>`)}function review(){let d=data.tasks.filter(t=>t.done).length;return wrap('本周复盘','回顾完成的事，为下一周留出空间。',`<div class="stats"><div><b>${d}</b><small>本周完成</small></div><div><b>${data.tasks.length-d}</b><small>未完成任务</small></div><div><b>${data.projects.length}</b><small>进行中项目</small></div></div><section class="card"><label>本周总结<textarea onchange="data.review=this.value;save()">${esc(data.review)}</textarea></label><label>下周计划<textarea onchange="data.next=this.value;save()">${esc(data.next)}</textarea></label><button class="primary" onclick="save()">保存复盘</button></section>`)}function settings(){return wrap('设置','这些偏好会保存在当前设备。',`<section class="card"><label>工作台名称<input value="我的工作台"></label><label>每日可用工作时长<input type="number" value="8"></label><label>默认任务时长（分钟）<input type="number" value="30"></label><button class="primary" onclick="alert('设置已保存')">保存设置</button></section>`)}function wrap(t,d,c,plus){return `<div class="page"><div class="intro"><div><small class="ey">个人工作台</small><h2>${t}</h2><p>${d}</p></div>${plus?'<button class="primary" onclick="newProject()">＋ 新建项目</button>':'<button class="primary" onclick="add()">＋ 新增</button>'}</div>${c}</div>`}function render(){let c=page==='今日'?today():page==='收集箱'?inbox():page==='项目'?projects():page==='日历'?calendar():page==='复盘'?review():settings();app.innerHTML=`<div class="app"><aside class="side"><button class="brand" onclick="go('今日')"><i>✓</i>我的工作台</button><small>工作台</small>${nav()}<button class="logout" onclick="logout()">⇥ 退出</button></aside><section class="main"><header><div><small>今天 · 7月30日，星期三</small><h1>${page}</h1></div><button class="primary" onclick="add()">＋ <span>快速添加</span></button></header>${c}</section>${page==='今日'?time():''}</div><nav class="tabs"><button onclick="go('今日')">今日</button><button onclick="go('收集箱')">收集箱</button><button onclick="go('项目')">项目</button><button onclick="go('日历')">日历</button><button onclick="go('复盘')">更多</button></nav>`}function go(x){page=x;render()}function toggle(id){let t=data.tasks.find(x=>x.id===id);t.done=!t.done;save()}function fold(g){let x=document.getElementById('g'+g);x.style.display=x.style.display==='none'?'block':'none'}function menu(id){document.getElementById('m'+id).innerHTML=`<div class="menu"><button onclick="openEdit(${id})">编辑</button><button onclick="tomorrow(${id})">延期到明天</button><button onclick="removeTask(${id})">删除</button></div>`}function tomorrow(id){let t=data.tasks.find(x=>x.id===id);t.date='2026-07-31';t.group='待安排';t.start='';save()}function removeTask(id){if(confirm('确定删除这项任务吗？')){data.tasks=data.tasks.filter(t=>t.id!==id);save()}}function add(start='',group='待安排'){editing={title:'',priority:'中',duration:30,date:T,start,project:'',group,done:false};editor()}function openEdit(id){editing=data.tasks.find(t=>t.id===id);editor()}function editor(){let t=editing;document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><form class="modal" onsubmit="submitTask(event)"><div class="modalhead"><h2>${t.id?'编辑任务':'新增任务'}</h2><button type="button" onclick="this.closest('.overlay').remove()">×</button></div><label>标题<input name="title" required value="${esc(t.title)}"></label><div class="fields"><label>项目<select name="project"><option>${t.project||'无项目'}</option>${data.projects.map(p=>`<option>${p}</option>`).join('')}</select></label><label>优先级<select name="priority"><option>高</option><option selected>中</option><option>低</option></select></label><label>预计时长<input name="duration" type="number" value="${t.duration}"></label><label>日期<input name="date" type="date" value="${t.date}"></label><label>开始时间<input name="start" type="time" value="${t.start||''}"></label><label>分组<select name="group"><option>上午</option><option>下午</option><option>待安排</option></select></label></div><label>备注<textarea></textarea></label><button class="primary">保存任务</button></form></div>`)}function submitTask(e){e.preventDefault();let f=e.target,t={...editing,id:editing.id||Date.now(),title:f.title.value,project:f.project.value==='无项目'?'':f.project.value,priority:f.priority.value,duration:+f.duration.value,date:f.date.value,start:f.start.value,group:f.group.value};if(editing.id)data.tasks=data.tasks.map(x=>x.id===t.id?t:x);else data.tasks.push(t);e.target.closest('.overlay').remove();save()}function newProject(){let n=prompt('项目名称');if(n){data.projects.push(n);save()}}function detail(p){page='项目';alert(p+'：'+data.tasks.filter(t=>t.project===p).map(t=>t.title).join('、'));}function logout(){if(confirm('确认退出并清除本地状态？')){localStorage.removeItem(K);location.reload()}}render();
</script></body></html>
