<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>亮的工作台</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;--border:#e2e8f0;--primary:#2563eb;--soft:#eff6ff;--success:#16a34a;--danger:#dc2626;--radius:12px;--shadow:0 4px 16px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,"Microsoft YaHei",sans-serif}.app{display:grid;min-height:100vh;grid-template-columns:244px 1fr}.side{padding:24px 14px;background:var(--surface);border-right:1px solid var(--border)}.brand{padding:0 12px 40px;font-size:20px;font-weight:700}.brand i{display:inline-grid;width:28px;height:28px;place-items:center;margin-right:10px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--primary);font-style:normal}.label{padding:0 12px;color:var(--faint);font-size:11px}.nav button{display:block;width:100%;margin:2px 0;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:600;text-align:left}.nav button.active{background:var(--soft);color:var(--primary)}main{max-width:1100px;width:100%;margin:auto;padding:0 6% 48px}.top{display:flex;height:80px;align-items:center;border-bottom:1px solid var(--border);color:var(--faint);font-size:13px}.intro{padding:42px 0 22px}.intro h1{margin:8px 0;font:700 32px Georgia,"Microsoft YaHei",serif}.intro p{color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{min-height:220px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}.card:hover{box-shadow:var(--shadow)}.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.head h2{margin:4px 0;font:700 19px Georgia,"Microsoft YaHei",serif}.ey{color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.08em}.primary,.secondary,.danger{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}.primary{border:1px solid var(--primary);background:var(--primary);color:#fff}.secondary{border:1px solid var(--border);background:#fff;color:var(--muted)}.danger{border:1px solid var(--danger);background:var(--danger);color:#fff}.task{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}.task:last-child{border:0}.task.done .title{color:var(--faint);text-decoration:line-through}.check{display:grid;width:18px;height:18px;place-items:center;border:1px solid var(--border);border-radius:5px;background:#fff;color:#fff;cursor:pointer}.done .check{border-color:var(--success);background:var(--success)}.task-main{flex:1;border:0;background:none;text-align:left;cursor:pointer}.title{display:block;font-size:13px;font-weight:600}.meta{display:block;margin-top:4px;color:var(--faint);font-size:11px}.actions button{border:0;background:none;color:var(--faint);font-size:11px;cursor:pointer}.actions button:last-child{color:var(--danger)}.event{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:8px}.event small{color:var(--muted)}.modal-bg{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:16px;background:rgba(15,23,42,.38)}.modal{width:min(100%,520px);border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}.modal header,.modal footer{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--border)}.modal footer{border-top:1px solid var(--border);border-bottom:0;justify-content:flex-end;gap:8px}.modal h2{margin:0;font-size:20px}.fields{display:grid;gap:14px;padding:20px}.fields label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.fields input,.fields textarea,.fields select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font:inherit}.fields textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{padding:24px 0;color:var(--muted);text-align:center}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;border-radius:10px;background:var(--text);color:#fff;font-size:13px}@media(max-width:800px){.app{display:block}.side{display:none}main{padding:0 16px 32px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.intro h1{font-size:28px}}
</style>
<body><div class="app"><aside class="side"><div class="brand"><i>亮</i>亮的工作台</div><div class="label">工作空间</div><nav class="nav"><button class="active">▦　总览</button><button>✓　我的任务</button><button>◇　项目</button><button>▣　日历</button><button>✎　笔记</button></nav></aside><main><div class="top">星期三，7月30日</div><div class="intro"><span class="ey">总览 / 今日</span><h1>早上好，ZJL</h1><p>把注意力留给真正重要的事。</p></div><div class="grid"><article class="card"><span class="ey">TODAY'S FOCUS</span><h2>今日重点</h2><p><b>完成个人工作台的第一版</b></p><p style="color:#64748b">把核心信息、任务流和项目状态放在一个更从容的界面里。</p></article><article class="card"><div class="head"><div><span class="ey">UP NEXT</span><h2>日程</h2></div><button class="primary" onclick="notice('添加日程入口已准备')">+ 添加日程</button></div><div class="event"><b>专注设计时间</b><br><small>今天 10:30 – 12:00</small></div><div class="event"><b>项目同步会</b><br><small>今天 14:00 · 30 分钟</small></div></article><article class="card"><div class="head"><div><span class="ey">MY TASKS</span><h2>待办事项 <small id="count"></small></h2></div><button class="primary" onclick="editTask()">+ 添加待办</button></div><div id="tasks"></div></article><article class="card"><div class="head"><div><span class="ey">IN PROGRESS</span><h2>项目与目标</h2></div><button class="primary" onclick="notice('添加目标入口已准备')">+ 添加目标</button></div><div class="event"><b>个人品牌网站　82%</b><br><small>设计 · 本周截止</small></div><button class="secondary" style="margin-top:14px" onclick="notice('新建记录入口已准备')">+ 新建记录</button></article></div></main></div><div id="modal"></div>
<script>
var key='github-worktable-tasks',tasks=[],editing=null;
try{tasks=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
if(!tasks.length)tasks=[{id:1,title:'完成个人工作台的第一版',due:'今天 11:30',category:'设计',duration:'2 小时',done:true},{id:2,title:'整理本周项目优先级',due:'今天 14:00',category:'规划',duration:'30 分钟',done:false}];
function save(){localStorage.setItem(key,JSON.stringify(tasks));draw()}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function draw(){var done=tasks.filter(function(t){return t.done}).length;count.textContent=done+'/'+tasks.length;tasks.innerHTML=tasks.length?tasks.map(function(t){return '<div class="task '+(t.done?'done':'')+'"><button class="check" onclick="toggleTask('+t.id+')">'+(t.done?'✓':'')+'</button><button class="task-main" onclick="editTask('+t.id+')"><span class="title">'+esc(t.title)+'</span><span class="meta">'+esc(t.category)+' · '+esc(t.due)+' · '+esc(t.duration)+'</span></button><span class="actions"><button onclick="editTask('+t.id+')">编辑</button><button onclick="deleteTask('+t.id+')">删除</button></span></div>'}).join(''):'<div class="empty">今天还没有待办，添加第一件事</div>'}
function toggleTask(id){tasks=tasks.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t});save();notice('已更新')}
function editTask(id){editing=tasks.filter(function(t){return t.id===id})[0]||null;var t=editing||{title:'',due:'',category:'',duration:'30 分钟'};modal.innerHTML='<div class="modal-bg"><form class="modal" onsubmit="submitTask(event)"><header><h2>'+(editing?'编辑待办':'添加待办')+'</h2><button type="button" class="secondary" onclick="closeModal()">关闭</button></header><div class="fields"><label>标题<input name="title" required value="'+esc(t.title)+'"></label><label>描述/备注<textarea name="note"></textarea></label><div class="two"><label>截止日期<input name="due" value="'+esc(t.due)+'" placeholder="今天 14:00"></label><label>所属分类<input name="category" value="'+esc(t.category)+'"></label></div><div class="two"><label>优先级<select name="priority"><option>低</option><option selected>中</option><option>高</option></select></label><label>预计时长<input name="duration" value="'+esc(t.duration)+'"></label></div></div><footer><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存</button></footer></form></div>'}
function submitTask(e){e.preventDefault();var f=e.target,t={id:editing?editing.id:Date.now(),title:f.title.value,due:f.due.value,category:f.category.value,duration:f.duration.value,done:editing?editing.done:false};tasks=editing?tasks.map(function(x){return x.id===t.id?t:x}):tasks.concat(t);closeModal();save();notice('已保存')}
function deleteTask(id){if(confirm('确认删除这条待办？')){tasks=tasks.filter(function(t){return t.id!==id});save();notice('已删除')}}
function closeModal(){modal.innerHTML='';editing=null}
function notice(s){var n=document.createElement('div');n.className='toast';n.textContent=s;document.body.appendChild(n);setTimeout(function(){n.remove()},1800)}
addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});draw();
</script></body></html>
